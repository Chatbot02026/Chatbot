<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatbot — Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input,
    button,
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input {
      margin-bottom: 12px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: #111;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .success {
      background: #198754;
      color: white;
    }

    .warning {
      background: #f0ad4e;
      color: white;
    }

    .secondary {
      background: #e9ecef;
      color: #111;
    }

    .error {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #a40000;
    }

    .success-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #e5f8ed;
      color: #08733b;
    }

    .admin-page {
      min-height: 100vh;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .admin-email {
      font-size: 13px;
      color: #bbb;
    }

    .logout {
      width: auto;
      background: #333;
      color: white;
      padding: 9px 14px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      width: auto;
      background: white;
      border: 1px solid #ddd;
    }

    .tab-btn.active {
      background: #111;
      color: white;
    }

    .section {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.04);
    }

    .section h2 {
      margin-top: 0;
    }

    .group {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .group-title {
      font-weight: 700;
      font-size: 17px;
    }

    .code {
      display: inline-block;
      background: #f1f1f1;
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-family: monospace;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .actions button {
      width: auto;
    }

    .request {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .request-line {
      margin: 5px 0;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .approved {
      background: #d1e7dd;
      color: #0f5132;
    }

    .rejected {
      background: #f8d7da;
      color: #842029;
    }

    .threat {
      background: #f8d7da;
      color: #842029;
    }

    .chat {
      height: 500px;
      display: flex;
      flex-direction: column;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f7f7f7;
    }

    .message {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .message-meta {
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }

    .chat-send {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .chat-send input {
      margin: 0;
      flex: 1;
    }

    .chat-send button {
      width: auto;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">Chatbot</div>

    <div class="subtitle">
      Admin panelinə giriş
    </div>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Admin email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Şifrə"
        required
      >

      <button class="primary" type="submit">
        Daxil ol
      </button>

    </form>

    <div id="loginError" class="error hidden"></div>

  </div>

</div>


<!-- ADMIN -->
<div id="adminPage" class="admin-page hidden">

  <header>

    <div>
      <h1>Chatbot Admin Panel</h1>

      <div id="adminEmail" class="admin-email"></div>
    </div>

    <button id="logoutBtn" class="logout">
      Çıxış
    </button>

  </header>


  <div class="container">

    <div class="tabs">

      <button
        class="tab-btn active"
        data-tab="groupsTab">
        Qruplar
      </button>

      <button
        class="tab-btn"
        data-tab="requestsTab">
        Qoşulma sorğuları
      </button>

      <button
        class="tab-btn"
        data-tab="chatTab">
        Admin çat
      </button>

    </div>


    <!-- GROUPS -->

    <div id="groupsTab" class="tab-content">

      <div class="section">

        <h2>Yeni qrup yarat</h2>

        <input
          id="groupName"
          type="text"
          placeholder="Qrup adı"
        >

        <button
          id="createGroupBtn"
          class="primary">
          Qrup yarat
        </button>

        <div id="groupCreateMessage"></div>

      </div>


      <div class="section">

        <h2>Qruplarım</h2>

        <div id="groupsList">
          Yüklənir...
        </div>

      </div>

    </div>


    <!-- REQUESTS -->

    <div id="requestsTab" class="tab-content hidden">

      <div class="section">

        <h2>Qoşulma sorğuları</h2>

        <div id="requestsList">
          Yüklənir...
        </div>

      </div>

    </div>


    <!-- CHAT -->

    <div id="chatTab" class="tab-content hidden">

      <div class="section">

        <h2>Admin çat</h2>

        <select id="chatGroupSelect">
          <option value="">Qrup seç</option>
        </select>

        <br><br>

        <div class="chat">

          <div
            id="chatMessages"
            class="messages">
          </div>

          <div class="chat-send">

            <input
              id="chatInput"
              type="text"
              placeholder="Mesaj yaz..."
            >

            <button
              id="sendChatBtn"
              class="primary">
              Göndər
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
} from "./supabase-config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const loginError =
  document.getElementById("loginError");

const adminEmail =
  document.getElementById("adminEmail");


function showLoginError(message) {

  loginError.textContent = message;

  loginError.classList.remove("hidden");

}


function hideLoginError() {

  loginError.classList.add("hidden");

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin() {

  const {
    data: { user }
  } = await supabase.auth.getUser();

  if (!user) {

    loginPage.classList.remove("hidden");
    adminPage.classList.add("hidden");

    return false;
  }


  const {
    data,
    error
  } = await supabase.rpc("is_admin");


  if (error || data !== true) {

    await supabase.auth.signOut();

    loginPage.classList.remove("hidden");
    adminPage.classList.add("hidden");

    showLoginError(
      "Bu hesabın admin panelinə giriş icazəsi yoxdur."
    );

    return false;
  }


  adminEmail.textContent =
    user.email;

  loginPage.classList.add("hidden");
  adminPage.classList.remove("hidden");

  return true;
}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    hideLoginError();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const {
      error
    } = await supabase.auth.signInWithPassword({
      email,
      password
    });


    if (error) {

      showLoginError(
        "Email və ya şifrə yanlışdır."
      );

      return;
    }


    const allowed =
      await checkAdmin();

    if (allowed) {

      await loadGroups();
      await loadRequests();
      await loadChatGroups();

    }

  });


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabase.auth.signOut();

    location.reload();

  });


/* =========================
   TABS
========================= */

document
  .querySelectorAll(".tab-btn")
  .forEach(btn => {

    btn.addEventListener("click", () => {

      document
        .querySelectorAll(".tab-btn")
        .forEach(x =>
          x.classList.remove("active")
        );

      btn.classList.add("active");


      document
        .querySelectorAll(".tab-content")
        .forEach(x =>
          x.classList.add("hidden")
        );


      document
        .getElementById(btn.dataset.tab)
        .classList.remove("hidden");

    });

  });


/* =========================
   GROUPS
========================= */

async function loadGroups() {

  const container =
    document.getElementById("groupsList");

  container.innerHTML =
    "Yüklənir...";


  const {
    data,
    error
  } = await supabase
    .from("groups")
    .select("*")
    .order("created_at", {
      ascending: false
    });


  if (error) {

    container.innerHTML =
      `<div class="error">
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "Hələ qrup yoxdur.";

    return;
  }


  container.innerHTML = "";


  data.forEach(group => {

    const div =
      document.createElement("div");

    div.className = "group";

    div.innerHTML = `

      <div class="group-title">
        ${escapeHtml(group.name)}
      </div>

      <div>
        <span class="code">
          Kod: ${escapeHtml(group.invite_code)}
        </span>
      </div>

      <div class="actions">

        <button
          class="warning"
          onclick="rotateCode('${group.id}')">
          Kodu dəyiş
        </button>

        <button
          class="danger"
          onclick="deleteGroup('${group.id}')">
          Qrupu sil
        </button>

      </div>
    `;


    container.appendChild(div);

  });

}


/* =========================
   CREATE GROUP
========================= */

document
  .getElementById("createGroupBtn")
  .addEventListener("click", async () => {

    const name =
      document.getElementById("groupName")
        .value
        .trim();


    if (!name) {

      alert("Qrup adını yaz.");

      return;
    }


    const {
      error
    } = await supabase.rpc(
      "create_chat_group",
      {
        group_name: name
      }
    );


    if (error) {

      document.getElementById(
        "groupCreateMessage"
      ).innerHTML = `
        <div class="error">
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    document.getElementById(
      "groupName"
    ).value = "";


    document.getElementById(
      "groupCreateMessage"
    ).innerHTML = `
      <div class="success-box">
        Qrup yaradıldı.
      </div>
    `;


    await loadGroups();
    await loadChatGroups();

  });


/* =========================
   ROTATE CODE
========================= */

window.rotateCode =
async function(groupId) {

  if (
    !confirm(
      "Bu qrupun kodunu dəyişmək istəyirsiniz?"
    )
  ) {
    return;
  }


  const {
    error
  } = await supabase.rpc(
    "rotate_group_code",
    {
      target_group: groupId
    }
  );


  if (error) {

    alert(error.message);

    return;
  }


  alert("Qrup kodu dəyişdirildi.");

  await loadGroups();

};


/* =========================
   DELETE GROUP
========================= */

window.deleteGroup =
async function(groupId) {

  if (
    !confirm(
      "Bu qrupu tamamilə silmək istəyirsiniz?"
    )
  ) {
    return;
  }


  const {
    error
  } = await supabase.rpc(
    "delete_chat_group",
    {
      target_group: groupId
    }
  );


  if (error) {

    alert(error.message);

    return;
  }


  await loadGroups();
  await loadRequests();
  await loadChatGroups();

};


/* =========================
   JOIN REQUESTS
========================= */

async function loadRequests() {

  const container =
    document.getElementById("requestsList");

  container.innerHTML =
    "Yüklənir...";


  const {
    data,
    error
  } = await supabase
    .from("join_requests")
    .select(`
      id,
      user_id,
      group_id,
      attempted_code,
      status,
      created_at
    `)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    container.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "Heç bir qoşulma sorğusu yoxdur.";

    return;
  }


  container.innerHTML = "";


  for (const request of data) {

    const div =
      document.createElement("div");

    div.className = "request";


    let groupName =
      "Naməlum qrup";


    if (request.group_id) {

      const {
        data: group
      } = await supabase
        .from("groups")
        .select("name")
        .eq("id", request.group_id)
        .maybeSingle();


      if (group) {
        groupName =
          group.name;
      }

    }


    div.innerHTML = `

      <div class="request-line">
        <strong>İstifadəçi:</strong>
        ${escapeHtml(request.user_id)}
      </div>

      <div class="request-line">
        <strong>Qrup:</strong>
        ${escapeHtml(groupName)}
      </div>

      <div class="request-line">
        <strong>Daxil edilən kod:</strong>
        <code>
          ${escapeHtml(request.attempted_code || "-")}
        </code>
      </div>

      <div class="request-line">
        <strong>Tarix:</strong>
        ${escapeHtml(
          new Date(
            request.created_at
          ).toLocaleString("az-AZ")
        )}
      </div>

      <div class="request-line">
        <strong>Status:</strong>
        <span class="status ${request.status}">
          ${escapeHtml(request.status)}
        </span>
      </div>


      ${
        request.status === "pending"
        ?
        `
        <div class="actions">

          <button
            class="success"
            onclick="reviewRequest(
              '${request.id}',
              'approved',
              '${request.group_id || ""}'
            )">
            Təsdiqlə
          </button>


          <button
            class="secondary"
            onclick="reviewRequest(
              '${request.id}',
              'rejected',
              '${request.group_id || ""}'
            )">
            Rədd et
          </button>


          ${
            request.group_id
            ?
            `
            <button
              class="danger"
              onclick="reviewRequest(
                '${request.id}',
                'threat',
                '${request.group_id}'
              )">
              Təhlükə
            </button>
            `
            :
            ""
          }

        </div>
        `
        :
        ""
      }

    `;


    container.appendChild(div);

  }

}


/* =========================
   REVIEW REQUEST
========================= */

window.reviewRequest =
async function(
  requestId,
  decision,
  groupId
) {

  let message =
    "Sorğunu təsdiqləmək istəyirsiniz?";


  if (decision === "rejected") {

    message =
      "Sorğunu rədd etmək istəyirsiniz?";
  }


  if (decision === "threat") {

    message =
      "Bu sorğunu təhlükə kimi işarələmək və qrup kodunu dəyişmək istəyirsiniz?";
  }


  if (!confirm(message)) {

    return;
  }


  const {
    error
  } = await supabase.rpc(
    "review_join_request",
    {
      target_request:
        requestId,

      decision:
        decision
    }
  );


  if (error) {

    alert(error.message);

    return;
  }


  if (
    decision === "threat" &&
    groupId
  ) {

    const {
      error: rotateError
    } = await supabase.rpc(
      "rotate_group_code",
      {
        target_group:
          groupId
      }
    );


    if (rotateError) {

      alert(
        "Sorğu təhlükə kimi işarələndi, amma kod dəyişdirilə bilmədi: " +
        rotateError.message
      );

      await loadRequests();

      return;
    }

  }


  await loadRequests();
  await loadGroups();

};


/* =========================
   ADMIN CHAT
========================= */

async function loadChatGroups() {

  const select =
    document.getElementById(
      "chatGroupSelect"
    );


  select.innerHTML =
    `<option value="">
      Qrup seç
    </option>`;


  const {
    data,
    error
  } = await supabase
    .from("groups")
    .select("id,name")
    .order("created_at", {
      ascending: false
    });


  if (error) {

    return;
  }


  data.forEach(group => {

    const option =
      document.createElement("option");

    option.value =
      group.id;

    option.textContent =
      group.name;

    select.appendChild(option);

  });

}


document
  .getElementById("chatGroupSelect")
  .addEventListener(
    "change",
    async function() {

      await loadChatMessages(
        this.value
      );

    }
  );


async function loadChatMessages(
  groupId
) {

  const container =
    document.getElementById(
      "chatMessages"
    );


  container.innerHTML =
    "";


  if (!groupId) {

    return;
  }


  const {
    data,
    error
  } = await supabase
    .from("messages")
    .select("*")
    .eq("group_id", groupId)
    .order("created_at", {
      ascending: true
    });


  if (error) {

    container.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  data.forEach(message => {

    addMessageToChat(
      message
    );

  });


  container.scrollTop =
    container.scrollHeight;

}


function addMessageToChat(
  message
) {

  const container =
    document.getElementById(
      "chatMessages"
    );


  const div =
    document.createElement("div");

  div.className =
    "message";


  div.innerHTML = `

    <div class="message-meta">
      ${escapeHtml(
        message.sender_id || ""
      )}

      ·

      ${escapeHtml(
        new Date(
          message.created_at
        ).toLocaleString(
          "az-AZ"
        )
      )}
    </div>

    <div>
      ${escapeHtml(
        message.content || ""
      )}
    </div>

  `;


  container.appendChild(div);

}


document
  .getElementById("sendChatBtn")
  .addEventListener(
    "click",
    async () => {

      const groupId =
        document.getElementById(
          "chatGroupSelect"
        ).value;


      const input =
        document.getElementById(
          "chatInput"
        );


      const content =
        input.value.trim();


      if (!groupId || !content) {

        return;
      }


      const {
        error
      } = await supabase
        .from("messages")
        .insert({
          group_id:
            groupId,

          sender_id:
            (
              await supabase.auth.getUser()
            ).data.user.id,

          content:
            content
        });


      if (error) {

        alert(error.message);

        return;
      }


      input.value = "";

      await loadChatMessages(
        groupId
      );

    }
  );


/* =========================
   REALTIME REQUESTS
========================= */

supabase
  .channel("admin-join-requests")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "join_requests"
    },
    async () => {

      if (
        !adminPage.classList.contains(
          "hidden"
        )
      ) {

        await loadRequests();

      }

    }
  )
  .subscribe();


/* =========================
   REALTIME CHAT
========================= */

supabase
  .channel("admin-messages")
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "messages"
    },
    payload => {

      const selectedGroup =
        document.getElementById(
          "chatGroupSelect"
        ).value;


      if (
        selectedGroup &&
        payload.new.group_id ===
        selectedGroup
      ) {

        addMessageToChat(
          payload.new
        );

        const container =
          document.getElementById(
            "chatMessages"
          );

        container.scrollTop =
          container.scrollHeight;

      }

    }
  )
  .subscribe();


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

  const allowed =

  if (allowed) {

    await loadGroups();
    await loadRequests();
    await loadChatGroups();

})();
