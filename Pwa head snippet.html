<!-- index.html faylında <head> daxilinə əlavə et -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chatbot">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<!-- </body>-dən əvvəl əlavə et -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  // "Ana ekrana əlavə et" düyməsi (Android/Chrome). Düymənin id-si: installBtn
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'inline-block';
  });
  document.addEventListener('click', async (e) => {
    if (e.target && e.target.id === 'installBtn' && deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      e.target.style.display = 'none';
    }
  });
</script>
